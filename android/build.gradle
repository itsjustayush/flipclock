plugins {
    id 'com.android.application' version '8.6.1' apply false
}
android {
    namespace 'com.appliance.clock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.appliance.clock'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}