<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebView Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      padding: 40px;
      border-radius: 30px;
      background: #292929;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      text-align: center;
    }

    h1 {
      color: #00ff99;
      font-size: 40px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>WEBVIEW CSS WORKS</h1>
    <p>If you can see this styling, Android WebView is fine.</p>
  </div>
</body>
</html>
