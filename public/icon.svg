<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#080808"/>
  <!-- Flip Card Container -->
  <g transform="translate(56, 56)">
    <!-- Main Card Body -->
    <rect width="400" height="400" rx="48" fill="#181818" />
    
    <!-- Top Half highlight -->
    <path d="M 0,48 Q 0,0 48,0 L 352,0 Q 400,0 400,48 L 400,198 L 0,198 Z" fill="#1e1e1e" />
    
    <!-- Bottom Half -->
    <path d="M 0,202 L 400,202 L 400,352 Q 400,400 352,400 L 48,400 Q 0,400 0,352 Z" fill="#151515" />
    
    <!-- Center Split Groove -->
    <rect y="198" width="400" height="4" fill="#050505" />
    <line x1="0" y1="198" x2="400" y2="198" stroke="#0a0a0a" stroke-width="1.5" />
    <line x1="0" y1="202" x2="400" y2="202" stroke="#252525" stroke-width="1" />

    <!-- Number 12 -->
    <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="210" fill="#f0f0f0" text-anchor="middle" letter-spacing="-6">12</text>
    
    <!-- Cut through text at split -->
    <rect y="198.5" width="400" height="3" fill="#050505" />

    <!-- Subtle PM indicator -->
    <text x="44" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#777777">PM</text>
  </g>
</svg>
